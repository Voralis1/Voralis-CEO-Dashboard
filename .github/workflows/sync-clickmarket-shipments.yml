name: Sync ClickMarket Shipments → Supabase

# Remplace n8n/clickmarket-shipments-sync.workflow.json (2026-08-05).
# Cadence horaire (demande CEO) pilotée directement par le `schedule` natif de GitHub Actions —
# contrairement aux synchros de commandes à 5 min (peu fiables nativement à cette précision, d'où
# pg_cron/pg_net en externe, voir sync-clickmarket.yml), un intervalle d'1h reste dans la marge de
# fiabilité normale de GitHub Actions : pas besoin de déclencheur externe ici.
on:
  schedule:
    - cron: "10 * * * *" # décalée de 10 min par rapport aux autres synchros stock pour étaler la charge
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/sync/requirements.txt

      - name: Lancer la synchro ClickMarket Shipments
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLICKMARKET_EMAIL: ${{ secrets.CLICKMARKET_EMAIL }}
          CLICKMARKET_PASSWORD: ${{ secrets.CLICKMARKET_PASSWORD }}
        run: python scripts/sync/sync_clickmarket_shipments.py
