name: Sync ClickMarket → Supabase

# Remplace n8n/clickmarket-sync.workflow.json (2026-07-31) — même modèle que sync-shipsen.yml.
#
# Cadence réelle de 5 min pilotée par pg_cron/pg_net (workflow_dispatch), PAS par le `schedule`
# GitHub natif (peu fiable, ~1h30-2h de retard constaté en pratique — voir sync-shipsen.yml pour
# le détail). Le `schedule` horaire ci-dessous n'est qu'un filet de sécurité.
on:
  schedule:
    - cron: "5 * * * *" # décalé de 5 min par rapport aux autres réseaux pour étaler la charge
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/sync/requirements.txt

      - name: Lancer la synchro ClickMarket
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLICKMARKET_EMAIL: ${{ secrets.CLICKMARKET_EMAIL }}
          CLICKMARKET_PASSWORD: ${{ secrets.CLICKMARKET_PASSWORD }}
        run: python scripts/sync/sync_clickmarket.py
