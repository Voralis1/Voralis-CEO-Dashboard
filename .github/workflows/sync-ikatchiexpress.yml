name: Sync Ikatchiexpress → Supabase

# Cadence réelle pilotée par pg_cron/pg_net (workflow_dispatch), PAS par le `schedule` GitHub
# natif (peu fiable — voir sync-shipsen.yml pour le détail). Le `schedule` ci-dessous n'est qu'un
# filet de sécurité horaire.
on:
  schedule:
    - cron: "30 * * * *" # décalé pour étaler la charge par rapport aux autres réseaux
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/sync/requirements.txt

      - name: Lancer la synchro Ikatchiexpress
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IKATCHIEXPRESS_EMAIL: ${{ secrets.IKATCHIEXPRESS_EMAIL }}
          IKATCHIEXPRESS_PASSWORD: ${{ secrets.IKATCHIEXPRESS_PASSWORD }}
        run: python scripts/sync/sync_ikatchiexpress.py
