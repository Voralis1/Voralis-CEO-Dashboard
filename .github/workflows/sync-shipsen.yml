name: Sync Shipsen → Supabase

# Remplace n8n/shipsen-leads-sync.workflow.json + n8n/shipsen-sync.workflow.json (2026-07-29).
#
# ⚠️ Le déclencheur `schedule` de GitHub Actions s'est avéré peu fiable pour un intervalle de 5
# min (vérifié en direct le 2026-07-30 : ~1h30-2h entre exécutions au lieu de 5 min — file
# d'attente best-effort côté GitHub, aggravée sur les repos publics/gratuits, non réparable par
# la config de ce fichier). La cadence réelle de 5 min vient désormais d'un déclencheur EXTERNE
# fiable : pg_cron + pg_net dans Supabase, qui appelle POST .../actions/workflows/.../dispatches
# (voir la conversation du 2026-07-30 pour le detail du setup SQL — vault.create_secret pour le
# PAT GitHub, cron.schedule pour la planification).
#
# Le `schedule` horaire ci-dessous n'est qu'un FILET DE SÉCURITÉ (defense in depth) si jamais le
# déclencheur pg_cron tombe en panne silencieusement — pas la cadence principale.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {} # déclenché par pg_cron/pg_net toutes les 5 min, ou manuellement depuis l'onglet Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # un run qui traîne ne doit jamais chevaucher le suivant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/sync/requirements.txt

      - name: Lancer la synchro Shipsen
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHIPSEN_EMAIL: ${{ secrets.SHIPSEN_EMAIL }}
          SHIPSEN_PASSWORD: ${{ secrets.SHIPSEN_PASSWORD }}
        run: python scripts/sync/sync_shipsen.py
